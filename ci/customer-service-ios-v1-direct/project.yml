name: CustomerServiceApp
options:
  bundleIdPrefix: com.yuyanfriends
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    PRODUCT_NAME: CustomerServiceApp
    DEVELOPMENT_TEAM: XTGL9G753G
targets:
  CustomerServiceApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CustomerServiceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuyanfriends.app
        INFOPLIST_FILE: CustomerServiceApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: CustomerServiceApp/CustomerServiceApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    entitlements:
      path: CustomerServiceApp/CustomerServiceApp.entitlements
      properties:
        aps-environment: production
