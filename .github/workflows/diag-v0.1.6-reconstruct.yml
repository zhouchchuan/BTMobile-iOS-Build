name: Diagnose BTMobile V0.1.6 reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/v016-debug-trigger.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci-repo
          fetch-depth: 0

      - name: Prepare clean source shell
        run: |
          set -e
          mkdir source
          tar -xzf ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz -C source
          cp ci-repo/ci/v015/archive_bridge.c source/Submodules/SwiftVLC/Sources/CLibVLC/archive_bridge.c
          cp ci-repo/ci/v016-files/ArchiveExtractor.swift source/Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift
          cat ci-repo/ci/v016-files/TorrentList.patch.part* > "$RUNNER_TEMP/TorrentList.patch"
          cd source
          patch -p1 < "$RUNNER_TEMP/TorrentList.patch"

      - name: Print reconstruction diagnostics
        run: |
          set +e
          cd source
          RESULT="$GITHUB_WORKSPACE/ci-repo/ci/v016-debug-results.txt"
          {
            echo 'BTMobile V0.1.6 reconstruction diagnostics'
            echo "patch_sha=$(sha256sum "$RUNNER_TEMP/TorrentList.patch" | awk '{print $1}')"
            echo "marketing_014_before=$(grep -c 'MARKETING_VERSION = 0.1.4;' iTorrent.xcodeproj/project.pbxproj)"
            echo "build_14_before=$(grep -c 'CURRENT_PROJECT_VERSION = 14;' iTorrent.xcodeproj/project.pbxproj)"
            python3 - <<'PY'
          from pathlib import Path
          p=Path('iTorrent.xcodeproj/project.pbxproj')
          s=p.read_text(encoding='utf-8')
          print('python_marketing_count=', s.count('MARKETING_VERSION = 0.1.4;'), sep='')
          print('python_build_count=', s.count('CURRENT_PROJECT_VERSION = 14;'), sep='')
          s=s.replace('MARKETING_VERSION = 0.1.4;', 'MARKETING_VERSION = 0.1.6;')
          s=s.replace('CURRENT_PROJECT_VERSION = 14;', 'CURRENT_PROJECT_VERSION = 17;')
          p.write_text(s, encoding='utf-8')
          PY
            echo "marketing_016_after=$(grep -c 'MARKETING_VERSION = 0.1.6;' iTorrent.xcodeproj/project.pbxproj)"
            echo "build_17_after=$(grep -c 'CURRENT_PROJECT_VERSION = 17;' iTorrent.xcodeproj/project.pbxproj)"
            echo "application_id_hits=$(grep -c 'APPLICATION_ID = com.mxmall123.app' iTorrent/Core/Assets/iTorrent.xcconfig)"
            echo "image_viewer_hits=$(grep -c 'final class BTImageViewerViewController' iTorrent/Screens/TorrentList/TorrentListViewController.swift)"
            echo "text_editor_hits=$(grep -c 'final class BTTextEditorViewController' iTorrent/Screens/TorrentList/TorrentListViewController.swift)"
            echo "sevenzip_hits=$(grep -c 'isSevenZipVolume' Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift)"
            echo "torrentlist_sha=$(sha256sum iTorrent/Screens/TorrentList/TorrentListViewController.swift | awk '{print $1}')"
            echo "archiveextractor_sha=$(sha256sum Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift | awk '{print $1}')"
            echo "archivebridge_sha=$(sha256sum Submodules/SwiftVLC/Sources/CLibVLC/archive_bridge.c | awk '{print $1}')"
            echo "torrentdetails_sha=$(sha256sum iTorrent/Screens/TorrentDetails/TorrentDetailsViewModel.swift | awk '{print $1}')"
            echo 'EXPECTED:'
            echo 'torrentlist=80786e0f41d00cc46101f0fcba98f718a1b0a5ec63f6b78be12f00e36cb64264'
            echo 'archiveextractor=ae2a5ec5c839cb2b37d8e560fe31fa064151315053fa8097b6bbf3cb6a1ab458'
            echo 'archivebridge=04952edc6e046813bd9cfa6558a4b2ed11ac1dd193e3edd06e66c1460fcf2a47'
            echo 'torrentdetails=e7536323ef11ecb2082f7c982a6c2ede2312ca283a91010c26c32b1651a2621a'
          } | tee "$RESULT"

      - name: Commit diagnostics
        if: always()
        run: |
          cd ci-repo
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/v016-debug-results.txt
          git diff --cached --quiet && exit 0
          git commit -m 'V0.1.6 reconstruction diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
