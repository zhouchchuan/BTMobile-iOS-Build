name: Build BTMobile V0.1.4 Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/BTMobile_V0.1.4_CI_Overlay.tar.gz'
      - '.github/workflows/build-v0.1.4.yml'

permissions:
  contents: write

concurrency:
  group: btmobile-v0.1.4-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout private CI repository
        uses: actions/checkout@v4
        with:
          path: ci-repo
          fetch-depth: 0

      - name: Verify V0.1.4 overlay exists
        run: |
          set -e
          test -f ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz
          echo 'Overlay SHA256:'
          shasum -a 256 ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz

      - name: Checkout pinned iTorrent base
        uses: actions/checkout@v4
        with:
          repository: XITRIX/iTorrent
          ref: v2.2.0-1
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Print build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install build dependencies
        run: brew install boost

      - name: Apply BTMobile V0.1.4 source overlay
        run: |
          set -e
          tar -xzf ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz -C source
          test -f source/BTMOBILE_0.1.4_DEV.md
          grep -q 'APPLICATION_ID = com.mxmall123.app' source/iTorrent/Core/Assets/iTorrent.xcconfig
          grep -q 'MARKETING_VERSION = 0.1.4' source/iTorrent.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 14' source/iTorrent.xcodeproj/project.pbxproj
          echo 'V0.1.4 overlay checks passed.'

      - name: Configure LibTorrent
        working-directory: source
        run: |
          set +e
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh > "$RUNNER_TEMP/libtorrent-build.log" 2>&1
          RC=$?
          echo "$RC" > "$RUNNER_TEMP/libtorrent.exit"
          cat "$RUNNER_TEMP/libtorrent-build.log"
          exit "$RC"

      - name: Preflight Xcode workspace
        working-directory: source
        run: |
          set +e
          {
            echo 'PWD:'
            pwd
            echo 'Workspace:'
            ls -la iTorrent.xcworkspace
            echo 'Shared schemes:'
            find iTorrent.xcodeproj/xcshareddata/xcschemes -maxdepth 1 -type f -print
            echo 'xcodebuild -list:'
            xcodebuild -list -workspace iTorrent.xcworkspace
          } > "$RUNNER_TEMP/xcode-preflight.log" 2>&1
          RC=$?
          echo "$RC" > "$RUNNER_TEMP/xcode-preflight.exit"
          cat "$RUNNER_TEMP/xcode-preflight.log"
          exit "$RC"

      - name: Build unsigned Release app
        working-directory: source
        run: |
          set +e
          echo 'Starting xcodebuild...' > "$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build >> "$RUNNER_TEMP/xcodebuild.log" 2>&1
          RC=$?
          echo "$RC" > "$RUNNER_TEMP/xcodebuild.exit"
          cat "$RUNNER_TEMP/xcodebuild.log"
          exit "$RC"

      - name: Validate application metadata
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          test -d "$APP"
          PLIST="$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          test "$BUNDLE" = 'com.mxmall123.app'
          test "$VERSION" = '0.1.4'
          test "$BUILD" = '14'

      - name: Package unsigned IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          OUT="$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/BTMobile.app"
          rm -rf "$OUT/Payload/BTMobile.app/_CodeSignature"
          cd "$OUT"
          /usr/bin/zip -qry "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" | tee "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned_SHA256.txt"
          ls -lh "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile_V0.1.4_Unsigned_IPA
          path: |
            ${{ runner.temp }}/BTMobile_V0.1.4_Unsigned.ipa
            ${{ runner.temp }}/BTMobile_V0.1.4_Unsigned_SHA256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Write build result back to private repository
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          RESULT_DIR="$GITHUB_WORKSPACE/ci-repo/ci/results"
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"

          {
            echo "BTMobile V0.1.4 GitHub Actions build"
            echo "status=$JOB_STATUS"
            echo "source_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS"
            echo "generated_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$RESULT_DIR/status.txt"

          for F in libtorrent-build.log libtorrent.exit xcode-preflight.log xcode-preflight.exit xcodebuild.log xcodebuild.exit; do
            if [ -f "$RUNNER_TEMP/$F" ]; then
              cp "$RUNNER_TEMP/$F" "$RESULT_DIR/$F"
            fi
          done

          if [ -f "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned_SHA256.txt" "$RESULT_DIR/BTMobile_V0.1.4_Unsigned_SHA256.txt"
            IPA_PATH="$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" RESULT_DIR="$RESULT_DIR" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          src = Path(os.environ['IPA_PATH'])
          out = Path(os.environ['RESULT_DIR'])
          chunk_size = 512 * 1024
          h = hashlib.sha256()
          count = 0
          size = 0
          with src.open('rb') as f:
              while True:
                  data = f.read(chunk_size)
                  if not data:
                      break
                  h.update(data)
                  size += len(data)
                  (out / f'BTMobile_V0.1.4_Unsigned.ipa.part.{count:04d}').write_bytes(data)
                  count += 1
          (out / 'manifest.txt').write_text(
              f'filename=BTMobile_V0.1.4_Unsigned.ipa\n'
              f'size={size}\n'
              f'sha256={h.hexdigest()}\n'
              f'chunk_size={chunk_size}\n'
              f'chunks={count}\n'
          )
          PY
          fi

          cd "$GITHUB_WORKSPACE/ci-repo"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git commit -m "CI result V0.1.4: $JOB_STATUS"
          git pull --rebase origin main
          git push origin HEAD:main
