name: Build BTMobile V0.1.4 Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/BTMobile_V0.1.4_CI_Overlay.tar.gz'
      - 'ci/build_v014.py'
      - '.github/workflows/build-v0.1.4.yml'

permissions:
  contents: write

concurrency:
  group: btmobile-v0.1.4-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout private CI repository
        uses: actions/checkout@v4
        with:
          path: ci-repo
          fetch-depth: 0

      - name: Verify V0.1.4 overlay exists
        run: |
          set -e
          test -f ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz
          test -f ci-repo/ci/build_v014.py
          echo 'Overlay SHA256:'
          shasum -a 256 ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz

      - name: Checkout pinned iTorrent base
        uses: actions/checkout@v4
        with:
          repository: XITRIX/iTorrent
          ref: v2.2.0-1
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Print build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install build dependencies
        run: brew install boost

      - name: Apply BTMobile V0.1.4 source overlay
        run: |
          set -e
          tar -xzf ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz -C source
          test -f source/BTMOBILE_0.1.4_DEV.md
          grep -q 'APPLICATION_ID = com.mxmall123.app' source/iTorrent/Core/Assets/iTorrent.xcconfig
          grep -q 'MARKETING_VERSION = 0.1.4' source/iTorrent.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 14' source/iTorrent.xcodeproj/project.pbxproj
          echo 'V0.1.4 overlay checks passed.'

      - name: Configure LibTorrent
        working-directory: source
        run: |
          set +e
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh > "$RUNNER_TEMP/libtorrent-build.log" 2>&1
          RC=$?
          echo "$RC" > "$RUNNER_TEMP/libtorrent.exit"
          cat "$RUNNER_TEMP/libtorrent-build.log"
          exit "$RC"

      - name: Preflight Xcode workspace
        working-directory: source
        run: |
          set +e
          {
            echo 'PWD:'
            pwd
            echo 'Workspace:'
            ls -la iTorrent.xcworkspace
            echo 'Shared schemes:'
            find iTorrent.xcodeproj/xcshareddata/xcschemes -maxdepth 1 -type f -print
            echo 'xcodebuild -list:'
            xcodebuild -list -workspace iTorrent.xcworkspace
          } > "$RUNNER_TEMP/xcode-preflight.log" 2>&1
          RC=$?
          echo "$RC" > "$RUNNER_TEMP/xcode-preflight.exit"
          cat "$RUNNER_TEMP/xcode-preflight.log"
          exit "$RC"

      - name: Build unsigned Release app
        id: xcodebuild
        continue-on-error: true
        working-directory: source
        run: python3 ../ci-repo/ci/build_v014.py

      - name: Extract xcresult diagnostics
        if: always()
        run: |
          set +e
          SUMMARY="$RUNNER_TEMP/xcresult-errors.txt"
          JSON="$RUNNER_TEMP/xcresult.json"
          BUNDLE="$RUNNER_TEMP/BuildResult.xcresult"
          : > "$SUMMARY"
          if [ -d "$BUNDLE" ]; then
            xcrun xcresulttool get --legacy --path "$BUNDLE" --format json > "$JSON" 2>/dev/null
            XC_RC=$?
            echo "xcresulttool_exit=$XC_RC" >> "$SUMMARY"
            if [ "$XC_RC" = 0 ]; then
              JSON_PATH="$JSON" OUT_PATH="$SUMMARY" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path(os.environ['JSON_PATH'])
          out = Path(os.environ['OUT_PATH'])
          try:
              data = json.loads(src.read_text(encoding='utf-8', errors='replace'))
          except Exception as exc:
              with out.open('a', encoding='utf-8') as f:
                  f.write(f'json_parse_error={exc}\n')
              raise SystemExit(0)

          found = []
          seen = set()

          def text_value(v):
              if isinstance(v, str):
                  return v
              if isinstance(v, dict):
                  for k in ('_value', 'value', 'message', 'title', 'description'):
                      x = v.get(k)
                      if isinstance(x, str):
                          return x
              return None

          def walk(node, path='root'):
              if isinstance(node, dict):
                  keys = set(node.keys())
                  candidate = []
                  for key in ('message', 'title', 'description', 'issueType', 'type', 'documentLocationInCreatingWorkspace'):
                      if key in node:
                          value = text_value(node[key])
                          if value:
                              candidate.append(f'{key}={value}')
                  joined = ' | '.join(candidate)
                  lower = joined.lower()
                  if joined and any(term in lower for term in ('error', 'failed', 'undefined', 'cannot', 'could not', 'no such', 'ambiguous', 'unavailable')):
                      if joined not in seen:
                          seen.add(joined)
                          found.append(joined)
                  for k, v in node.items():
                      walk(v, f'{path}.{k}')
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f'{path}[{i}]')

          walk(data)
          with out.open('a', encoding='utf-8') as f:
              f.write('\n=== XCRESULT ERROR CANDIDATES ===\n')
              if found:
                  f.write('\n'.join(found[:500]))
                  f.write('\n')
              else:
                  f.write('(none found)\n')
          PY
            fi
          else
            echo 'xcresult bundle missing' >> "$SUMMARY"
          fi
          echo '=== xcresult diagnostic summary ==='
          cat "$SUMMARY"

      - name: Stop after Xcode failure
        if: steps.xcodebuild.outcome == 'failure'
        run: |
          echo 'xcodebuild failed; diagnostics were captured.'
          exit 1

      - name: Validate application metadata
        if: steps.xcodebuild.outcome == 'success'
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          test -d "$APP"
          PLIST="$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          test "$BUNDLE" = 'com.mxmall123.app'
          test "$VERSION" = '0.1.4'
          test "$BUILD" = '14'

      - name: Package unsigned IPA
        if: steps.xcodebuild.outcome == 'success'
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          OUT="$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/BTMobile.app"
          rm -rf "$OUT/Payload/BTMobile.app/_CodeSignature"
          cd "$OUT"
          /usr/bin/zip -qry "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" | tee "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned_SHA256.txt"
          ls -lh "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa"

      - name: Upload unsigned IPA artifact
        if: steps.xcodebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile_V0.1.4_Unsigned_IPA
          path: |
            ${{ runner.temp }}/BTMobile_V0.1.4_Unsigned.ipa
            ${{ runner.temp }}/BTMobile_V0.1.4_Unsigned_SHA256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Write build result back to private repository
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          XCODE_OUTCOME: ${{ steps.xcodebuild.outcome }}
        run: |
          set +e
          RESULT_DIR="$GITHUB_WORKSPACE/ci-repo/ci/results"
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"

          {
            echo "BTMobile V0.1.4 GitHub Actions build"
            echo "status=$JOB_STATUS"
            echo "xcode_outcome=$XCODE_OUTCOME"
            echo "source_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS"
            echo "generated_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$RESULT_DIR/status.txt"

          for F in libtorrent-build.log libtorrent.exit xcode-preflight.log xcode-preflight.exit xcodebuild.log xcodebuild.exit xcode-summary.txt xcresult-errors.txt; do
            if [ -f "$RUNNER_TEMP/$F" ]; then
              cp "$RUNNER_TEMP/$F" "$RESULT_DIR/$F"
            fi
          done

          if [ -f "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned_SHA256.txt" "$RESULT_DIR/BTMobile_V0.1.4_Unsigned_SHA256.txt"
            IPA_PATH="$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" RESULT_DIR="$RESULT_DIR" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          src = Path(os.environ['IPA_PATH'])
          out = Path(os.environ['RESULT_DIR'])
          chunk_size = 512 * 1024
          h = hashlib.sha256()
          count = 0
          size = 0
          with src.open('rb') as f:
              while True:
                  data = f.read(chunk_size)
                  if not data:
                      break
                  h.update(data)
                  size += len(data)
                  (out / f'BTMobile_V0.1.4_Unsigned.ipa.part.{count:04d}').write_bytes(data)
                  count += 1
          (out / 'manifest.txt').write_text(
              f'filename=BTMobile_V0.1.4_Unsigned.ipa\n'
              f'size={size}\n'
              f'sha256={h.hexdigest()}\n'
              f'chunk_size={chunk_size}\n'
              f'chunks={count}\n'
          )
          PY
          fi

          cd "$GITHUB_WORKSPACE/ci-repo"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git commit -m "CI result V0.1.4: $JOB_STATUS"
          git pull --rebase origin main
          git push origin HEAD:main
