name: macOS Runner Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Probe macOS and Xcode
        run: |
          mkdir -p ci
          {
            echo 'macos_probe=ok'
            sw_vers | tr '\n' ';'
            echo
            xcodebuild -version | tr '\n' ';'
            echo
            echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > ci/macos-probe.txt
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/macos-probe.txt
          git commit -m 'macOS probe: success'
          git pull --rebase origin main
          git push origin HEAD:main
