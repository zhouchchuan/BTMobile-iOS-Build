name: Build Customer Service iOS V1.0.0 Unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - customer-service-ios-v1.0.0
    paths:
      - '.github/workflows/build-customer-service-ios-v1.yml'

permissions:
  contents: read

concurrency:
  group: customer-service-ios-v1.0.0
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build tools
        run: brew install xcodegen imagemagick

      - name: Restore V1.0.0 source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/customer-service-src"
          cat > "$RUNNER_TEMP/source.b64" <<'SOURCE_B64'
          
          SOURCE_B64
          /usr/bin/base64 -D "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/customer-service-src"
          cd "$RUNNER_TEMP/customer-service-src"
          test -f project.yml
          test -f CustomerServiceApp/RootView.swift
          test -f CustomerServiceApp/BrandIcon.svg
          test -f CustomerServiceApp/LaunchBackground.svg

      - name: Render app icon and launch artwork
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/customer-service-src/CustomerServiceApp"
          magick -background none "$SRC/BrandIcon.svg" -resize 1024x1024 "$SRC/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          magick -background none "$SRC/BrandIcon.svg" -resize 240x240 "$SRC/Assets.xcassets/AppLoginLogo.imageset/AppLoginLogo.png"
          magick -background none "$SRC/LaunchBackground.svg" -resize '430x932!' "$SRC/Assets.xcassets/LaunchBackground.imageset/LaunchBackground.png"
          file "$SRC/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          file "$SRC/Assets.xcassets/LaunchBackground.imageset/LaunchBackground.png"

      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/customer-service-src
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project CustomerServiceApp.xcodeproj -scheme CustomerServiceApp -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET'

      - name: Build unsigned Release app
        working-directory: ${{ runner.temp }}/customer-service-src
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/CustomerServiceDerivedData"
          xcodebuild \
            -project CustomerServiceApp.xcodeproj \
            -scheme CustomerServiceApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/CustomerServiceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Validate and package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/CustomerServiceDerivedData/Build/Products/Release-iphoneos/CustomerServiceApp.app"
          test -d "$APP"
          PLIST="$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          test "$BUNDLE" = 'com.yuyanfriends.app'
          test "$VERSION" = '1.0.0'
          test "$BUILD" = '1'
          test -f "$APP/CustomerServiceApp"
          test -f "$APP/Assets.car"
          OUT="$RUNNER_TEMP/CustomerService_iOS_V1.0.0_Unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/CustomerServiceApp.app"
          rm -rf "$OUT/Payload/CustomerServiceApp.app/_CodeSignature"
          rm -f "$OUT/Payload/CustomerServiceApp.app/embedded.mobileprovision"
          cd "$OUT"
          /usr/bin/zip -qry "$RUNNER_TEMP/CustomerService_iOS_V1.0.0_Unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/CustomerService_iOS_V1.0.0_Unsigned.ipa" > "$RUNNER_TEMP/CustomerService_iOS_V1.0.0_Unsigned_SHA256.txt"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomerService_iOS_V1.0.0_Unsigned_IPA
          path: |
            ${{ runner.temp }}/CustomerService_iOS_V1.0.0_Unsigned.ipa
            ${{ runner.temp }}/CustomerService_iOS_V1.0.0_Unsigned_SHA256.txt
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: error
