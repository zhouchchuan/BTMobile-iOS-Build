name: Build BTMobile V0.1.6 Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/v016-final-trigger.txt'

permissions:
  contents: write

concurrency:
  group: btmobile-v0.1.6-final
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout private CI repository
        uses: actions/checkout@v4
        with:
          path: ci-repo
          fetch-depth: 0

      - name: Checkout pinned iTorrent base
        uses: actions/checkout@v4
        with:
          repository: XITRIX/iTorrent
          ref: v2.2.0-1
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependency
        run: brew install boost

      - name: Reconstruct exact V0.1.6 final source overlay
        run: |
          set -e
          test -f ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz
          test -f ci-repo/ci/v016-final/overlay.b64.00
          test -f ci-repo/ci/v016-final/overlay.b64.05

          cat ci-repo/ci/v016-final/overlay.b64.* | /usr/bin/base64 -D > "$RUNNER_TEMP/BTMobile_V0.1.6_FinalOverlay.tar.gz"
          echo "Reconstructed overlay SHA256: $(shasum -a 256 "$RUNNER_TEMP/BTMobile_V0.1.6_FinalOverlay.tar.gz" | awk '{print $1}')"
          gzip -t "$RUNNER_TEMP/BTMobile_V0.1.6_FinalOverlay.tar.gz"

          tar -xzf ci-repo/ci/BTMobile_V0.1.4_CI_Overlay.tar.gz -C source
          tar -xzf "$RUNNER_TEMP/BTMobile_V0.1.6_FinalOverlay.tar.gz" -C source

          grep -q 'APPLICATION_ID = com.mxmall123.app' source/iTorrent/Core/Assets/iTorrent.xcconfig
          grep -q 'MARKETING_VERSION = 0.1.6' source/iTorrent.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 17' source/iTorrent.xcodeproj/project.pbxproj
          grep -q 'final class BTImageViewerViewController' source/iTorrent/Screens/TorrentList/TorrentListViewController.swift
          grep -q 'final class BTTextEditorViewController' source/iTorrent/Screens/TorrentList/TorrentListViewController.swift
          grep -q 'isSevenZipVolume' source/Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift

          test "$(shasum -a 256 source/iTorrent/Screens/TorrentList/TorrentListViewController.swift | awk '{print $1}')" = '80786e0f41d00cc46101f0fcba98f718a1b0a5ec63f6b78be12f00e36cb64264'
          test "$(shasum -a 256 source/Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift | awk '{print $1}')" = '421bd416b6cfbe90be4e0067d17934ba19724e858156102eed8cf9eddf2cdf86'
          test "$(shasum -a 256 source/Submodules/SwiftVLC/Sources/CLibVLC/archive_bridge.c | awk '{print $1}')" = '04952edc6e046813bd9cfa6558a4b2ed11ac1dd193e3edd06e66c1460fcf2a47'
          test "$(shasum -a 256 source/iTorrent/Services/TorrentService/TorrentService.swift | awk '{print $1}')" = '7180f57aef70a721484b19b1047164215f145fc3c8c864d30bfa455f00e8b78c'
          echo 'Exact V0.1.6 final source files verified byte-for-byte.'

      - name: Verify frozen V0.1.5 app-side BT baseline
        working-directory: source
        run: |
          set -e
          test "$(shasum -a 256 iTorrent/Screens/TorrentDetails/TorrentDetailsViewModel.swift | awk '{print $1}')" = 'e7536323ef11ecb2082f7c982a6c2ede2312ca283a91010c26c32b1651a2621a'
          echo 'App-side BT baseline frozen.'

      - name: Swift syntax preflight
        working-directory: source
        run: |
          set -e
          xcrun swiftc -frontend -parse iTorrent/Screens/TorrentList/TorrentListViewController.swift
          xcrun swiftc -frontend -parse Submodules/SwiftVLC/Sources/SwiftVLC/Archive/ArchiveExtractor.swift
          echo 'Swift syntax preflight passed.'

      - name: Configure LibTorrent
        working-directory: source
        run: |
          set -e
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh

      - name: Build unsigned Release app
        id: xcodebuild
        continue-on-error: true
        working-directory: source
        run: python3 ../ci-repo/ci/build_v014.py

      - name: Verify frozen BT core after CI restore
        if: steps.xcodebuild.outcome == 'success'
        working-directory: source
        run: |
          set -e
          test "$(shasum -a 256 iTorrent/Screens/TorrentDetails/TorrentDetailsViewModel.swift | awk '{print $1}')" = 'e7536323ef11ecb2082f7c982a6c2ede2312ca283a91010c26c32b1651a2621a'
          test "$(shasum -a 256 Submodules/LibTorrent-Swift/LibTorrent/Core/TorrentHandle/TorrentHandle.h | awk '{print $1}')" = '251de6d80f37c6b28e42a462c7654d0c987d07463150d8454e08a11cb931b728'
          test "$(shasum -a 256 Submodules/LibTorrent-Swift/LibTorrent/Core/TorrentHandle/TorrentHandle.mm | awk '{print $1}')" = 'ca194dd422817e105abfd5aac284294acc7aae887308bdf6448340750274227'
          test "$(shasum -a 256 Submodules/LibTorrent-Swift/LibTorrent/Core/SessionSettings/SessionSettings.mm | awk '{print $1}')" = '02debe4d7e5641912d4d421f135eba7d5ad7d7741bb167f221055d307c25aa0e'
          test "$(shasum -a 256 Submodules/LibTorrent-Swift/LibTorrent/Core/Session/Session.mm | awk '{print $1}')" = '92383097d81c8edb9178b8efe9307432d9cb7b22fe39c0c6f85d331b4a1cfb4c'
          echo 'Frozen BT core hashes unchanged.'

      - name: Stop after Xcode failure
        if: steps.xcodebuild.outcome == 'failure'
        run: |
          echo 'xcodebuild failed'
          exit 1

      - name: Validate V0.1.6 metadata and package IPA
        if: steps.xcodebuild.outcome == 'success'
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          test -d "$APP"
          PLIST="$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          test "$BUNDLE" = 'com.mxmall123.app'
          test "$VERSION" = '0.1.6'
          test "$BUILD" = '17'

          OUT="$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/BTMobile.app"
          rm -rf "$OUT/Payload/BTMobile.app/_CodeSignature"
          rm -f "$OUT/Payload/BTMobile.app/embedded.mobileprovision"
          cd "$OUT"
          /usr/bin/zip -qry "$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned.ipa" | tee "$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned_SHA256.txt"

      - name: Upload V0.1.6 unsigned IPA
        if: steps.xcodebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile_V0.1.6_Unsigned_IPA_Final
          path: |
            ${{ runner.temp }}/BTMobile_V0.1.6_Unsigned.ipa
            ${{ runner.temp }}/BTMobile_V0.1.6_Unsigned_SHA256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Write V0.1.6 final build result back
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          XCODE_OUTCOME: ${{ steps.xcodebuild.outcome }}
        run: |
          set +e
          RESULT_DIR="$GITHUB_WORKSPACE/ci-repo/ci/v016-final-results"
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          {
            echo 'BTMobile V0.1.6 Final GitHub Actions build'
            echo "status=$JOB_STATUS"
            echo "xcode_outcome=$XCODE_OUTCOME"
            echo "source_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS"
            echo "generated_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$RESULT_DIR/status.txt"
          for F in xcodebuild.log xcodebuild.exit xcode-summary.txt; do
            if [ -f "$RUNNER_TEMP/$F" ]; then cp "$RUNNER_TEMP/$F" "$RESULT_DIR/$F"; fi
          done
          if [ -f "$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned_SHA256.txt" ]; then
            cp "$RUNNER_TEMP/BTMobile_V0.1.6_Unsigned_SHA256.txt" "$RESULT_DIR/"
          fi
          cd "$GITHUB_WORKSPACE/ci-repo"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/v016-final-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CI final result V0.1.6: $JOB_STATUS"
          git pull --rebase origin main
          git push origin HEAD:main
