name: Actions Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write probe result
        run: |
          mkdir -p ci
          printf 'actions_probe=ok\ncommit=%s\nutc=%s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > ci/probe.txt
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f ci/probe.txt
          git commit -m 'CI probe: success'
          git pull --rebase origin main
          git push origin HEAD:main
