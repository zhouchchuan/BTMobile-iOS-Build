name: HarmonyOS AV1 playback regression tests
on:
  push:
    branches: [harmonyos-v0.1.0]
    paths: ['HarmonyOS/entry/src/main/cpp/media*', 'HarmonyOS/entry/src/main/ets/components/Player.ets', 'HarmonyOS/tests/media*', 'HarmonyOS/ci/media*', '.github/workflows/harmony-media-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  av1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install host media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev nlohmann-json3-dev
      - name: Decode AV1 audio/video, pause, seek and clean up
        run: bash HarmonyOS/ci/media-tests.sh
