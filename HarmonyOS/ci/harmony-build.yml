name: BTMobile HarmonyOS V1.0.3
on:
  workflow_dispatch:
  push:
    branches: [harmonyos-v0.1.0]
    paths: ['HarmonyOS/**', '.github/workflows/harmony-v010.yml']
permissions:
  contents: read
concurrency:
  group: harmony-v010
  cancel-in-progress: true
jobs:
  hap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Range and extraction safety tests
        run: |
          g++ -std=c++17 -Wall -Wextra HarmonyOS/tests/range_test.cpp -o /tmp/range-test
          /tmp/range-test
      - name: Restore official SDK cache
        uses: actions/cache@v4
        with:
          path: /opt/harmony-cli
          key: harmony-cli-linux-5.0.3.906-v1
      - name: Install official HarmonyOS toolchain
        run: |
          set -euo pipefail
          if [ ! -d /opt/harmony-cli/command-line-tools ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
            aria2c --max-connection-per-server=4 --split=4 --max-tries=5 --retry-wait=5 --dir=/tmp --out=harmony.zip https://repo.huaweicloud.com/harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip
            echo 'c6fe61299e1b05e4023e643a319ee74c3eb369af7edecd5c3f1795b16f9db6af  /tmp/harmony.zip' | sha256sum -c -
            sudo mkdir -p /opt/harmony-cli
            sudo chown -R "$USER" /opt/harmony-cli
            unzip -q /tmp/harmony.zip -d /opt/harmony-cli
          fi
          TOOL=/opt/harmony-cli/command-line-tools
          echo "DEVECO_SDK_HOME=$TOOL/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$TOOL/sdk/default/openharmony/native" >> "$GITHUB_ENV"
          echo "$TOOL/bin" >> "$GITHUB_PATH"
          echo "$TOOL/tool/node/bin" >> "$GITHUB_PATH"
          find "$TOOL/sdk" -name oh-uni-package.json -maxdepth 6 -exec cat {} \;
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1
      - name: Player controls and UI model regression tests
        working-directory: HarmonyOS
        run: |
          SDK_TS="$DEVECO_SDK_HOME/default/openharmony/ets/build-tools/ets-loader/node_modules/typescript/lib/typescript.js"
          node tests/player-policy-test.cjs "$SDK_TS"
          node tests/ui-source-test.cjs "$SDK_TS"
          node tests/v016-controls-test.cjs "$SDK_TS"
          node tests/subscription-test.cjs "$SDK_TS"
          node tests/subscription-startup-test.cjs "$SDK_TS"
          node tests/v102-settings-test.cjs "$SDK_TS"
          node tests/notification-test.cjs "$SDK_TS"
      - name: Save SDK cache before dependency compilation
        uses: actions/cache/save@v4
        with:
          path: /opt/harmony-cli
          key: harmony-cli-linux-5.0.3.906-v1
      - name: Restore native dependencies
        uses: actions/cache@v4
        with:
          path: HarmonyOS/native-deps
          key: harmony-native-api12-arm64-75a08775-v3-7zip2604
          restore-keys: harmony-native-api12-arm64-75a08775-v2
      - name: Compile real native dependencies
        run: |
          bash HarmonyOS/ci/native-deps.sh
          bash HarmonyOS/ci/archive-deps.sh ohos
      - name: Restore AV1 compatibility decoder cache
        uses: actions/cache@v4
        with:
          path: HarmonyOS/native-deps/media
          key: harmony-media-api12-arm64-ffmpeg801-dav1d153-v1
      - name: Compile AV1 compatibility decoder
        run: |
          sudo apt-get install -y meson ninja-build pkg-config
          bash HarmonyOS/ci/media-deps.sh
      - name: Save AV1 compatibility decoder cache
        uses: actions/cache/save@v4
        with:
          path: HarmonyOS/native-deps/media
          key: harmony-media-api12-arm64-ffmpeg801-dav1d153-v1
      - name: Save native dependency cache before application compilation
        uses: actions/cache/save@v4
        with:
          path: HarmonyOS/native-deps
          key: harmony-native-api12-arm64-75a08775-v3-7zip2604
      - name: Build native HAP (unsigned)
        working-directory: HarmonyOS
        run: |
          set -euo pipefail
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all
          hvigorw --mode module -p product=default -p module=entry@default -p buildMode=debug assembleHap --no-daemon --stacktrace
      - name: Real native engine tracker and network adapter tests
        working-directory: HarmonyOS
        run: |
          sudo apt-get install -y libarchive-dev libssl-dev 7zip zip ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libegl1-mesa-dev libgles2-mesa-dev
          bash ci/media-tests.sh
          bash ci/archive-deps.sh host
          export LD_LIBRARY_PATH="$PWD/native-deps/host-archive"
          cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target archive-test -j3
          python3 tests/archive-fixtures.py build-host/archive-test
          cmake --build build-host -j3
          build-host/settings-test
          build-host/network-test
          TEST_DIR=$(mktemp -d)
          timeout 120 build-host/core-test "$TEST_DIR"
      - name: Verify compiled package
        run: |
          set -euo pipefail
          mkdir -p HarmonyOS/artifacts
          HAP=$(find HarmonyOS/entry/build -name '*unsigned.hap' -print -quit)
          test -n "$HAP"
          cp "$HAP" HarmonyOS/artifacts/BTMobile_HarmonyOS_V1.0.3_Unsigned.hap
          unzip -l "$HAP" | tee HarmonyOS/artifacts/package-contents.txt
          unzip -l "$HAP" | grep 'ets/modules.abc'
          unzip -l "$HAP" | grep 'libbtmobile.so'
          unzip -l "$HAP" | grep 'lib7zip.so'
          unzip -l "$HAP" | grep 'libbtmedia.so'
          unzip -l "$HAP" | grep 'libavcodec.so'
          mkdir -p HarmonyOS/artifacts/corresponding-source
          cp HarmonyOS/native-deps/sevenzip-26.04.tar.gz HarmonyOS/native-deps/bit7z.tar.gz HarmonyOS/artifacts/corresponding-source/
          cp HarmonyOS/ci/patch-archive.py HarmonyOS/ci/archive-deps.sh HarmonyOS/artifacts/corresponding-source/
          cp HarmonyOS/native-deps/media/ffmpeg-8.0.1.tar.xz HarmonyOS/native-deps/media/dav1d-1.5.3.tar.xz HarmonyOS/ci/media-deps.sh HarmonyOS/artifacts/corresponding-source/
          sha256sum HarmonyOS/artifacts/*.hap | tee HarmonyOS/artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTMobile-HarmonyOS-V1.0.3
          path: |
            HarmonyOS/artifacts/
            HarmonyOS/entry/build/default/outputs/default/*.hap
            HarmonyOS/build-profile.json5
            HarmonyOS/.hvigor/report/
          if-no-files-found: warn
          retention-days: 14
